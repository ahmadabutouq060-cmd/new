name: NASEEJ CI

on:
  push:
    branches: ["main", "fix-*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install route-verification dependency
        run: npm install --no-save jsdom

      - name: Verify every route
        run: node scripts/verify-routes.mjs
