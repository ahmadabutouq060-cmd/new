name: Import NASEEJ photo bundle

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful GitHub Actions run containing the shard artifacts"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download successful photo shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          pattern: naseej-place-shard-*
          path: collected
          merge-multiple: true

      - name: Restore downloaded images
        run: |
          rm -rf assets/places
          mkdir -p assets/places
          if [ -d collected/assets/places ]; then
            cp -R collected/assets/places/. assets/places/
          fi

      - name: Make standalone zip bundle
        run: |
          mkdir -p downloads
          rm -f downloads/NASEEJ-place-images.zip
          zip -r -q downloads/NASEEJ-place-images.zip assets/places
          ls -lh downloads/NASEEJ-place-images.zip

      - name: Commit actual images
        run: |
          git config user.name "NASEEJ Photo Importer"
          git config user.email "actions@users.noreply.github.com"
          git add assets/places downloads/NASEEJ-place-images.zip
          if git diff --cached --quiet; then
            echo "No downloaded images to import."
            exit 0
          fi
          git commit -m "Import NASEEJ place image bundle [skip ci]"
          git push
