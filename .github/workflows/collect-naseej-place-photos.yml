name: Collect NASEEJ place photos
on:
  push:
    paths:
      - "scripts/download-naseej-place-images.mjs"
      - "docs/naseej-place-image-manifest.json"
      - ".github/workflows/collect-naseej-place-photos.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect Wikimedia Commons photos
        run: node scripts/download-naseej-place-images.mjs
      - name: Commit photos and manifest
        run: |
          git config user.name "NASEEJ Image Collector"
          git config user.email "actions@users.noreply.github.com"
          git add assets/places docs/naseej-place-image-manifest.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Add NASEEJ place photos [skip ci]"; git push; fi