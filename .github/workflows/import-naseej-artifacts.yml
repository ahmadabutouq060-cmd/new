name: Import NASEEJ photo bundle

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful GitHub Actions run containing the shard artifacts"
        required: true
        type: string

# Writes assets/places, so it shares the group with the parallel collector and the
# Commons fetcher. Running two of them at once interleaves their files into a
# tree that looks plausible enough to commit.
concurrency:
  group: naseej-photo-writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download successful photo shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          pattern: naseej-place-shard-*
          path: collected
          merge-multiple: true

      # Validates the artifact layout, names every imported file from its bytes
      # rather than the extension the source manifest guessed, and leaves
      # existing valid images in place where a shard carried no replacement. It
      # used to be replaced by an `rm -rf assets/places` plus a copy, which
      # discarded every generated placeholder along with the images.
      - name: Merge shard manifests and images
        run: node scripts/merge-naseej-place-image-shards.mjs

      - name: Wire verified photos into the site
        run: node scripts/wire-waypoint-images.cjs

      - name: Verify the tree before committing
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Make standalone zip bundle
        run: |
          mkdir -p downloads
          rm -f downloads/NASEEJ-place-images.zip
          zip -r -q downloads/NASEEJ-place-images.zip assets/places
          ls -lh downloads/NASEEJ-place-images.zip

      - name: Commit actual images
        run: |
          git config user.name "NASEEJ Photo Importer"
          git config user.email "actions@users.noreply.github.com"
          git add assets/places docs/naseej-place-image-manifest.json downloads/NASEEJ-place-images.zip js/data.js
          if git diff --cached --quiet; then
            echo "No downloaded images to import."
            exit 0
          fi
          git commit -m "Import NASEEJ place image bundle [skip ci]"
          git push
